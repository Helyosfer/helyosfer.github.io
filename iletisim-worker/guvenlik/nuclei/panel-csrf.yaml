id: iletisim-panel-csrf

info:
  name: Panelde değiştiren istekler başka bir siteden gönderilebiliyor (CSRF)
  author: helyosfer
  severity: high
  description: >
    Panelin POST/DELETE istekleri yalnızca `x-panel: 1` başlığı olan ve kendi kökeninden gelen istekleri kabul etmeli.
    Yerelde (Access yokken JWT doğrulaması da kapalıysa) çalıştırılır; canlıda Access istekleri zaten 302 ile durdurur.
  tags: iletisim,csrf,yerel

variables:
  sohbet: "00000000-0000-4000-8000-000000000000"

http:
  - raw:
      # Başlık yok (düz bir HTML formu gibi)
      - |
        POST /admin/api/sohbetler/{{sohbet}}/durum HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"durum":"kapali"}

      # Başlık var ama başka siteden
      - |
        POST /admin/api/sohbetler/{{sohbet}}/yanit HTTP/1.1
        Host: {{Hostname}}
        Origin: https://kotu.example
        x-panel: 1
        Content-Type: application/json

        {"metin":"csrf"}

      - |
        DELETE /admin/api/sohbetler/{{sohbet}} HTTP/1.1
        Host: {{Hostname}}
        Origin: https://kotu.example
        x-panel: 1
    redirects: false
    matchers:
      # 403 (yetki) ya da 302 (Access) beklenir; 2xx ya da 404 (sohbet_yok: yetki denetimi geçilmiş demektir) açıktır
      - type: dsl
        dsl:
          - status_code >= 200 && status_code < 300
          - contains(body, '"sohbet_yok"')
        condition: or
