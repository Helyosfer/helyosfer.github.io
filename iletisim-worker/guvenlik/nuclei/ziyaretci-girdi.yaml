id: iletisim-ziyaretci-girdi-denetimi

info:
  name: Sohbet API'si bozuk ya da kötü niyetli girdiyi kabul ediyor
  author: helyosfer
  severity: medium
  description: >
    Tuzak alanı dolu, çok uzun, yanlış türde ya da yanlış Content-Type ile gelen mesajlar 400 ile reddedilmeli;
    uydurma bir sohbet belirteciyle mesaj okunamamalı. Bu şablon veri YAZAR (geçerli olmayan istekler reddedilmezse),
    o yüzden yalnızca yerelde çalıştırılır.
  tags: iletisim,girdi,yerel
  # Her istek ayrı bir saldırı; biri bile kabul edilirse eşleşir.

variables:
  koken: "http://127.0.0.1:5500"
  uzun: "{{repeat('a', 2001)}}"

http:
  - raw:
      # 1) Tuzak alanı (bot)
      - |
        POST /v1/mesaj HTTP/1.1
        Host: {{Hostname}}
        Origin: {{koken}}
        Content-Type: application/json

        {"metin":"merhaba","web":"http://spam.example"}

      # 2) Sınırın bir fazlası
      - |
        POST /v1/mesaj HTTP/1.1
        Host: {{Hostname}}
        Origin: {{koken}}
        Content-Type: application/json

        {"metin":"{{uzun}}"}

      # 3) Tür karışıklığı
      - |
        POST /v1/mesaj HTTP/1.1
        Host: {{Hostname}}
        Origin: {{koken}}
        Content-Type: application/json

        {"metin":["a"],"ad":{"$ne":null}}

      # 4) JSON olmayan gövde (form gönderimiyle CSRF denemesi)
      - |
        POST /v1/mesaj HTTP/1.1
        Host: {{Hostname}}
        Origin: {{koken}}
        Content-Type: text/plain

        {"metin":"merhaba"}

      # 5) Uydurma belirteçle başkasının sohbetini okuma
      - |
        GET /v1/mesaj HTTP/1.1
        Host: {{Hostname}}
        Origin: {{koken}}
        Authorization: Bearer 00000000-0000-4000-8000-000000000000.AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    redirects: false
    matchers:
      - type: dsl
        dsl:
          - status_code == 200 || status_code == 201
