id: iletisim-cors-yabanci-koken

info:
  name: Sohbet API'si yabancı sitelere açık (CORS)
  author: helyosfer
  severity: high
  description: >
    İzin listesinde olmayan bir kökenden gelen isteğe Access-Control-Allow-Origin dönüyor ya da istek işleniyor.
    Böyle olursa başka bir site ziyaretçinin tarayıcısı üzerinden sohbet açıp mesaj okuyabilir.
  tags: iletisim,cors,canli

http:
  - raw:
      - |
        OPTIONS /v1/mesaj HTTP/1.1
        Host: {{Hostname}}
        Origin: https://kotu.example
        Access-Control-Request-Method: POST
        Access-Control-Request-Headers: content-type, authorization

      - |
        GET /v1/mesaj HTTP/1.1
        Host: {{Hostname}}
        Origin: null

      - |
        GET /v1/mesaj HTTP/1.1
        Host: {{Hostname}}
        Origin: https://helyosfer.me.kotu.example
    redirects: false
    matchers-condition: or
    matchers:
      - type: regex
        part: header
        regex:
          - "(?i)access-control-allow-origin:\\s*(\\*|null|https://kotu\\.example|https://helyosfer\\.me\\.kotu\\.example)"
      - type: dsl
        dsl:
          - status_code != 403
