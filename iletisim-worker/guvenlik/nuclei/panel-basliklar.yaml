id: iletisim-panel-guvenlik-basliklari

info:
  name: Panel sayfası güvenlik başlıkları eksik
  author: helyosfer
  severity: medium
  description: >
    Panel sayfası katı bir CSP (frame-ancestors 'none' dahil), nosniff ve no-store ile gelmeli.
    Panele giriş gerektiği için yalnızca yerelde ve GELISTIRME=1 iken anlamlıdır; CI bunu ayrı bir işte çalıştırır.
  tags: iletisim,basliklar,yerel-panel

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin"
    redirects: false
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
      - type: dsl
        dsl:
          - "!contains(tolower(header), \"frame-ancestors 'none'\")"
          - "!contains(tolower(header), \"x-content-type-options: nosniff\")"
          - "!contains(tolower(header), \"cache-control: no-store\")"
          - "!contains(tolower(header), \"script-src 'self'\")"
        condition: or
