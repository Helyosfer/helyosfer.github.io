# İletişim Worker'ı için güvenlik denetimleri (ProjectDiscovery Nuclei).
# Her şablon bir AÇIK bulduğunda eşleşir; temiz bir çalıştırma hiçbir sonuç vermez.
#
# Çalıştırma (README'deki "Güvenlik taraması" bölümü):
#   Yerel:  nuclei -t guvenlik/nuclei/ -u http://127.0.0.1:8787 -var koken=http://127.0.0.1:5500
#   Canlı:  nuclei -t guvenlik/nuclei/ -u https://iletisim.helyosfer.me -var koken=https://helyosfer.me -tags canli
#
# Canlıda yalnızca "canli" etiketli, veri yazmayan şablonlar çalışır (GET ve reddedilmesi gereken istekler).
# Yerel taramada GELISTIRME=1 OLMAMALI (CI bunu ayrı bir .dev.vars ile sağlar), yoksa panel kilidi atlanır.

id: iletisim-panel-kilitsiz

info:
  name: Panel API'si giriş olmadan açılıyor
  author: helyosfer
  severity: critical
  description: /admin uçları Cloudflare Access ya da Worker'ın JWT doğrulaması olmadan veri döndürüyor.
  tags: iletisim,auth,canli

http:
  - method: GET
    path:
      - "{{BaseURL}}/admin"
      - "{{BaseURL}}/admin/api/sohbetler"
      - "{{BaseURL}}/ADMIN/api/sohbetler"
      - "{{BaseURL}}//admin/api/sohbetler"
      - "{{BaseURL}}/%61dmin/api/sohbetler"
      - "{{BaseURL}}/admin/panel.js"
    redirects: false
    stop-at-first-match: true
    matchers-condition: or
    matchers:
      - type: dsl
        name: sohbet-listesi
        dsl:
          - status_code == 200 && contains(body, '"sohbetler"')
      - type: dsl
        name: panel-sayfasi
        dsl:
          - status_code == 200 && (contains(body, 'İletişim paneli') || contains(body, 'yanit-metin'))
