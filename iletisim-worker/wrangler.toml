# İletişim Worker'ı: hizmetler sayfasındaki sohbet penceresi ve yönetim paneli. Kurulum: README.md.
name = "iletisim"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Yalnızca kendi alan adından erişilir; workers.dev ve önizleme adresleri kapalı.
workers_dev = false
preview_urls = false
routes = [{ pattern = "iletisim.helyosfer.me", custom_domain = true }]

[vars]
# Sohbet penceresinin çalışabileceği siteler (virgülle ayrılır)
IZINLI_KOKENLER = "https://helyosfer.me"
# Bildirim e-postası Proton Mail'in SMTP sunucusundan gider (src/eposta.js). GONDEREN, Proton'daki SMTP
# token'ının bağlı olduğu adres; ALICI bildirimin gideceği adres. İkisi de sitede zaten açıkça yazıyor.
GONDEREN = "mail@helyosfer.me"
ALICI = "mail@helyosfer.me"
# E-postadaki panel bağlantısı
PANEL_ADRESI = "https://iletisim.helyosfer.me/admin"
# Cloudflare Access (Zero Trust) takım adresi ve panel uygulamasının AUD etiketi (README).
# İkisi de boşsa panel kimseye açılmaz.
ACCESS_TAKIM = "polished-firefly-16bd.cloudflareaccess.com"
ACCESS_AUD = "942ba046543550643f9db150719cda8f1a27b39f4e01a41aae81e3bb634b5d84"
# Yapay zekâ asistanının modeli (Google Gemini API). Anahtar tanımlı değilse asistan kapalıdır,
# her mesaj doğrudan Helyosfer'e gider.
GEMINI_MODEL = "gemini-3.5-flash"
# Gizli değerler (wrangler secret put):
#   SMTP_SIFRESI    → Proton'da mail@helyosfer.me için oluşturulan SMTP token'ı
#   GEMINI_ANAHTARI → Google AI Studio'dan alınan Gemini API anahtarı

[[d1_databases]]
binding = "DB"
database_name = "iletisim"
database_id = "a4abb146-2b97-48cb-9296-e54d0acf87f1"
migrations_dir = "migrations"

# IP başına dakikada 5 mesaj
[[ratelimits]]
name = "MESAJ_SINIRI"
namespace_id = "1101"
simple = { limit = 5, period = 60 }

# IP başına dakikada 2 yeni sohbet
[[ratelimits]]
name = "SOHBET_SINIRI"
namespace_id = "1102"
simple = { limit = 2, period = 60 }

# Sohbet penceresi açıkken cevapları yoklar: IP başına dakikada 30 okuma
[[ratelimits]]
name = "OKUMA_SINIRI"
namespace_id = "1103"
simple = { limit = 30, period = 60 }

# Gözlem ve kayıt kapalı: mesajlar yalnızca veritabanında durur.
[observability]
enabled = false
