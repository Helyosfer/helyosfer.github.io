# Sohbet penceresi ve panel için uçtan uca testler (Playwright: Chromium, Firefox, WebKit).
# Testler CI içinde yerel sunucular açar (site, Worker, sahte Gemini); canlıya ve e-postaya dokunmaz.
name: Uçtan uca testler

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "hizmetler/**"
      - "style.css"
      - "ortak.js"
      - "iletisim-worker/**"
      - ".github/workflows/uctan-uca.yml"

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: iletisim-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: iletisim-worker/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
        env:
          CI: "1"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-raporu
          path: |
            iletisim-worker/e2e/rapor/
            iletisim-worker/e2e/sonuclar/
